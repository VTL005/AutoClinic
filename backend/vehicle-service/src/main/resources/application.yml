server:
  port: 8082

spring:
  application:
    name: vehicle-service

  datasource:
    url: jdbc:mysql://localhost:3306/vehicle_db?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: vehicle_user
    password: ${VEHICLE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

  endpoint:
    health:
      show-details: always

app:
  jwt:
    issuer: car-service-identity
    secret: ${AUTOSERVICE_JWT_SECRET}

  vin:
    base-url: https://vpic.nhtsa.dot.gov/api/vehicles
    cache-ttl: P7D